
name: Build Windows EXE

on:
  push:
    branches:
      - "feature/desktop-winter-experience-v1.1.0"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build standalone EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --collect-all pystray --collect-all PIL --icon "assets/app_icon.ico"
          --add-data "assets;assets"
          --name MinaChristmasDesktop MinaChristmasDesktop.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinaChristmasDesktop-Windows-x64
          path: dist/MinaChristmasDesktop.exe
          if-no-files-found: error
          retention-days: 30

      - name: Package browser extension
        shell: pwsh
        run: Compress-Archive -Path browser_extension\\* -DestinationPath dist\\MinaChristmasBrowserExtension-v1.1.0.zip -Force

      - name: Upload browser extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinaChristmasBrowserExtension-v1.1.0
          path: dist/MinaChristmasBrowserExtension-v1.1.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MinaChristmasDesktop.exe
            dist/MinaChristmasBrowserExtension-v1.1.0.zip
